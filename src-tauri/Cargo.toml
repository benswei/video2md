[package]
name = "video2md"
version = "0.1.7"
description = "Video2MD - Convert video/audio materials to structured knowledge handbooks"
authors = ["Video2MD Team"]
edition = "2021"

[lib]
name = "video2md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "rng"] }
base64 = "0.22"
